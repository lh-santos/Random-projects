<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelaGo</title>
    <link rel= "icon"  href= "imagens/favicon (3).ico"  type= "image/x-icon" >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header" id="header">
        <button onclick="togglesidebar()" class="btn_icon_header">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
            </svg>   
        </button>
        <div class="logo_header">
            <img src="imagens/logo.png" class="img_logo" alt="Logo">
        </div>
        <div class="navitelago_header" id="navitelago_header">
            <button onclick="togglesidebar()" class="btn_icon_header">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-x" viewBox="0 0 16 16">
                     <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                </svg>
            </button>
            <a href="#">Home</a>
            <a href="#">Letra</a>
            <a href="#">Fotos</a>
            <a href="#">Apresentações</a>
            <a href="#">Videos</a>
        </div>
    </div>
<div tabindex="0" onclick="closeSidebar()" class="content" id="content"> <!-- "tabindex="0" deixar o area clicavel-->
        <h1>Testes do site</h1>
    </div>
</body>
    <script>
        var header = document.getElementById('header');
        var navitelago_header = document.getElementById('navitelago_header');
        var content = document.getElementById('content');
        var showSidebar = false;

        function togglesidebar() { /*alterna para a barra lateral*/
            showSidebar = !showSidebar;
            if(showSidebar) {
                navitelago_header.style.marginLeft = '-10vw';
                navitelago_header.style.animationName = 'showSidebar';
                content.style.filter = 'blur(2px)';
            } else {
                navitelago_header.style.marginLeft = '-100vw';
                navitelago_header.style.animationName = '';
                content.style.filter = '';
            }
        }

        function closeSidebar() {
            if (showSidebar) {
                togglesidebar(); /*Fecha o sidebar quando tocado em uma area fora dele*/
            }
        }

        window.addEventListener('resize', function(event) {
            if (window.innerWidth > 768 && showSidebar) {
                togglesidebar();
            }
        }
    )
    </script>
</html>
