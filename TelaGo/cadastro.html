<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelaGo</title>
    <link rel= "icon"  href= "imagens/favicon (3).ico"  type= "image/x-icon" >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <button onclick="togglesidebar()" class="btn_icon_header">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          fill="currentColor"
          class="bi bi-list"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"
          />
        </svg>
      </button>
      <div class="logo_header">
        <img src="imagens/logo.png" class="img_logo" alt="Logo" />
      </div>
      <div class="navitelago_header" id="navitelago_header">
        <button onclick="togglesidebar()" class="btn_icon_header">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="currentColor"
            class="bi bi-x"
            viewBox="0 0 16 16"
          >
            <path
              d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
            />
          </svg>
        </button>
        <a href="telago.html" class="active">Home</a>
        <a href="#" class="active">Pastorais</a>
        <a href="#" class="active">Confissões</a>
        <a href="#" class="active">Agendamentos</a>

    </header>    
    <main class="container">
        <section class="inscricao">
            <article>
                <h1>Inscreva-se</h1>

                <form action="nome">Informe seu nome</form>
                <input type="text" id="nome">     

                <form action="tel">Telefone</form>
                <input type="tel" id="tel">   

                <form action="email">E-mail</form>
                <input type="email" id="email">    

                <form action="comunidade">Comunidade</form>
                <input type="text" id="comunidade">                
            </article>
        </section>
    </main>
</body>
<script src="telago.js"></script>
</html>
